bio: |
  I am an M.S. student in Computational Science and Engineering at Georgia Institute of
  Technology, with a home unit in Mechanical Engineering. Prior to this, I worked as a
  Research Assistant in the Department of Computer Science at Emory University under the
  supervision of Professor Liang Zhao. My research interests lie at the intersection of AI
  and adjacent disciplines, including computational physics, embodied intelligence, and
  physics-informed learning. I am especially interested in building learning systems that
  can capture scientific structure and support discovery in complex physical and multimodal
  environments.

