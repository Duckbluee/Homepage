<style>
  #section-resume-biography-3 h1 {
    font-size: clamp(2rem, 3vw, 2.75rem);
    white-space: pre-line;
    line-height: 1.08;
  }

  #section-resume-biography-3 .md\:col-span-4 .space-y-3 {
    max-width: 100%;
  }

  #section-resume-biography-3 .md\:col-span-4 .space-y-3 > p.text-2xl {
    font-size: 1.35rem;
    line-height: 1.35;
    white-space: pre-line;
  }

  #section-resume-biography-3 .md\:col-span-4 .space-y-3 > p.text-lg {
    margin-top: 0.65rem;
  }

  #section-resume-biography-3 .profile-contact-email {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
    margin-top: 1rem;
    padding: 0.85rem 1rem;
    border: 1px solid rgb(229 231 235);
    border-radius: 0.9rem;
    background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    color: rgb(31 41 55);
    text-decoration: none;
    word-break: break-word;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  #section-resume-biography-3 .profile-contact-email:hover {
    color: rgb(30 64 175);
    border-color: rgb(147 197 253);
    box-shadow: 0 14px 30px rgba(37, 99, 235, 0.14);
    transform: translateY(-1px);
  }

  .dark #section-resume-biography-3 .profile-contact-email {
    background: rgba(31, 41, 55, 0.92);
    border-color: rgb(75 85 99);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    color: rgb(243 244 246);
  }

  .dark #section-resume-biography-3 .profile-contact-email:hover {
    color: rgb(191 219 254);
    border-color: rgb(96 165 250);
  }

  #section-resume-biography-3 .profile-contact-email-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgb(107 114 128);
  }

  #section-resume-biography-3 .profile-contact-email-line {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.98rem;
    font-weight: 600;
    line-height: 1.4;
  }

  #section-resume-biography-3 .profile-contact-email-icon {
    width: 1rem;
    height: 1rem;
    flex-shrink: 0;
  }

  .dark #section-resume-biography-3 .profile-contact-email-label {
    color: rgb(156 163 175);
  }

  #section-resume-biography-3 .md\:col-span-8 .grid {
    display: block;
  }

  #section-resume-biography-3 .md\:col-span-8 .grid > .group {
    width: 100%;
    min-height: unset;
    border-radius: 0.75rem;
    padding: 1.25rem 1.5rem;
  }

  #section-resume-biography-3 .md\:col-span-8 .grid > .group .flex.gap-4 {
    align-items: center;
  }

  #section-resume-biography-3 .md\:col-span-8 .grid > .group p.text-xl {
    font-size: 1.25rem;
    line-height: 1.35;
  }

  @media (max-width: 640px) {
    #section-resume-biography-3 h1 {
      font-size: 1.95rem;
      white-space: pre-line;
    }
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const educationDates = document.querySelectorAll(
      '#section-resume-biography-3 .md\\:col-span-8 .grid .group .text-gray-500'
    );
    const nameHeading = document.querySelector('#section-resume-biography-3 h1');
    const contactRow = document.querySelector('#section-resume-biography-3 .md\\:col-span-4 .flex.flex-wrap.justify-center.gap-4');
    const emailLink = contactRow ? contactRow.querySelector('a[href^="mailto:"]') : null;

    educationDates.forEach((node) => {
      const parts = node.innerHTML
        .split(/<br\s*\/?>/i)
        .map((part) => part.trim())
        .filter(Boolean);

      const shortParts = parts.map((part) => {
        const match = part.match(/^(\d{4})-(\d{2})-\d{2}$/);
        return match ? match[1] + '-' + match[2] : part;
      });

      if (parts.length > 1) {
        node.textContent = shortParts.join(' - ');
      } else if (shortParts.length === 1) {
        node.textContent = shortParts[0];
      }
    });

    if (nameHeading) {
      const lines = nameHeading.innerHTML.split(/<br\s*\/?>/i);
      if (lines.length >= 3) {
        lines[2] = '<span style="display:inline-block; margin-top:0.42em;">' + lines[2].trim() + '</span>';
        nameHeading.innerHTML = lines.join('<br>');
      }
    }

    if (contactRow && emailLink && !document.querySelector('#section-resume-biography-3 .profile-contact-email')) {
      const visibleEmail = document.createElement('a');
      visibleEmail.className = 'profile-contact-email';
      visibleEmail.href = emailLink.href;
      visibleEmail.innerHTML =
        '<span class="profile-contact-email-label">Email</span>' +
        '<span class="profile-contact-email-line">' +
        '<svg class="profile-contact-email-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M4 6h16v12H4z"></path>' +
        '<path d="m4 7 8 6 8-6"></path>' +
        '</svg>' +
        '<span>' + emailLink.href.replace(/^mailto:/i, '') + '</span>' +
        '</span>';
      contactRow.insertAdjacentElement('afterend', visibleEmail);
    }
  });
</script>
